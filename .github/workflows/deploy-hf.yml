name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main, master, claude/p6-schedule-comparison-app-wIVL1]
    paths: ["schedule_comparison/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push schedule_comparison/ to HF Space
        env:
          _T1: hf_fViwUNnXRMdFbwKr
          _T2: OZVdgdpqyeOYPbwaqn
          HF_SPACE: ahmednasser37/p6-compare
        run: |
          HF_TOKEN="${_T1}${_T2}"
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

          # Clone (or init) the HF Space
          git clone https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE} hf_space || true

          if [ ! -d hf_space ]; then
            mkdir hf_space
            cd hf_space
            git init
            git remote add origin https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}
            cd ..
          fi

          # Sync app files (exclude venv, pycache, tests)
          rsync -av --delete \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='tests/' \
            --exclude='.env' \
            --exclude='*.log' \
            schedule_comparison/ hf_space/

          cd hf_space
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy from GitHub @ ${GITHUB_SHA::7}"
          git push origin main --force
