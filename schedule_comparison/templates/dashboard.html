<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P6 Compare — {{ data.project.updated_name or 'Dashboard' }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="app dark">

  <!-- LEFT SIDEBAR: brand + nav + slicer -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">&#9889;</span>
      <span class="brand-name">P6 Compare</span>
    </div>

    <nav class="sidebar-nav" role="navigation" aria-label="Dashboard tabs">
      <button class="nav-item active" data-tab="executive"   aria-selected="true">
        <span class="nav-icon">&#128202;</span><span class="nav-label">Executive</span>
      </button>
      <button class="nav-item" data-tab="scurve"      aria-selected="false">
        <span class="nav-icon">&#128200;</span><span class="nav-label">S-Curve</span>
      </button>
      <button class="nav-item" data-tab="spitrends"   aria-selected="false">
        <span class="nav-icon">&#128201;</span><span class="nav-label">SPI / CPI</span>
      </button>
      <button class="nav-item" data-tab="drilldown"   aria-selected="false">
        <span class="nav-icon">&#128193;</span><span class="nav-label">Drilldown</span>
      </button>
      <button class="nav-item" data-tab="trade"       aria-selected="false">
        <span class="nav-icon">&#128300;</span><span class="nav-label">Trade Analysis</span>
      </button>
      <button class="nav-item" data-tab="manpower"    aria-selected="false">
        <span class="nav-icon">&#128119;</span><span class="nav-label">Manpower</span>
      </button>
      <button class="nav-item" data-tab="slip"        aria-selected="false">
        <span class="nav-icon">&#9201;</span><span class="nav-label">Slip Detail</span>
      </button>
    </nav>

    <!-- WBS Slicer Engine -->
    <div class="slicer-panel" id="slicer-panel">
      <div class="slicer-hd">
        <span class="slicer-title">FILTERS</span>
        <button class="slicer-reset-btn" id="slicer-reset">RESET ALL</button>
      </div>
      <div class="slicer-body" id="slicer-body">
        <!-- JS fills slicer dropdowns dynamically based on WBS hierarchy depth -->
      </div>
    </div>

    <div class="sidebar-footer">
      <a href="/export/csv?key={{ key }}" class="sidebar-export-btn">&#8595; CSV</a>
      <a href="/export/json?key={{ key }}" class="sidebar-export-btn">&#8595; JSON</a>
      <a href="/" class="sidebar-export-btn">+ New</a>
    </div>
    <button class="collapse-btn" id="collapse-btn" aria-label="Collapse sidebar">&#8249;</button>
  </aside>

  <!-- MAIN: topbar + tab panels -->
  <div class="main-area" id="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-heading" id="page-heading">Executive Overview</h1>
        <div class="project-crumb" id="project-crumb">
          <span class="crumb crumb-baseline">{{ data.project.baseline_name or 'Baseline' }}</span>
          <span class="crumb-arrow">&#8594;</span>
          <span class="crumb crumb-updated">{{ data.project.updated_name or 'Updated' }}</span>
        </div>
      </div>
      <div class="topbar-right">
        <span class="health-badge" id="health-badge"></span>
        <span class="data-date-chip" id="data-date-chip">Data Date: &#8212;</span>
        <span class="filter-active-chip" id="filter-chip" style="display:none">Filtered</span>
      </div>
    </header>

    <main class="content-area" id="content-area">
      <!-- Tab panels injected by JS -->
      <div class="tab-panel active" id="panel-executive"  role="tabpanel"></div>
      <div class="tab-panel"        id="panel-scurve"     role="tabpanel"></div>
      <div class="tab-panel"        id="panel-spitrends"  role="tabpanel"></div>
      <div class="tab-panel"        id="panel-drilldown"  role="tabpanel"></div>
      <div class="tab-panel"        id="panel-trade"      role="tabpanel"></div>
      <div class="tab-panel"        id="panel-manpower"   role="tabpanel"></div>
      <div class="tab-panel"        id="panel-slip"       role="tabpanel"></div>
    </main>
  </div>

  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-hd" id="drawer-hd">
      <span id="drawer-title"></span>
      <button class="drawer-close" id="drawer-close" aria-label="Close">&#10005;</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script>window.__DASH__={{ data|tojson }};window.__KEY__="{{ key }}";</script>
  <script src="/static/dashboard.js"></script>
</body>
</html>
